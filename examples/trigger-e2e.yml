# THIS FILE DOES NOT RUN HERE. It is the step that goes in the APPLICATION's deploy pipeline
# (e.g. .github/workflows/deploy.yml in the application repo), right AFTER the staging deploy.
#
# It only tells the e2e repo "there is a new version on staging" and finishes immediately:
# the deploy does not wait for the tests, nor fail if they fail.
#
# It needs a token with access to the e2e repo (the default GITHUB_TOKEN only works
# for its own repo). Create a fine-grained token, or a GitHub App, with
# "Contents: read and write" on the e2e repo and save it as the E2E_DISPATCH_TOKEN secret.

      - name: Trigger e2e tests
        env:
          GH_TOKEN: ${{ secrets.E2E_DISPATCH_TOKEN }}
        run: |
          gh api repos/GabrielBruno7/curupira/dispatches \
            -f event_type=deploy-staging \
            -f "client_payload[app]=${{ github.event.repository.name }}" \
            -f "client_payload[version]=${{ github.sha }}"
