      - name: Trigger e2e tests
        env:
          GH_TOKEN: ${{ secrets.E2E_DISPATCH_TOKEN }}
        run: |
          gh api repos/GabrielBruno7/curupira/dispatches \
            -f event_type=deploy-staging \
            -f "client_payload[app]=${{ github.event.repository.name }}" \
            -f "client_payload[version]=${{ github.sha }}"
