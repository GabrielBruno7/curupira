# Roda os testes num container com o Playwright (Node 24 + Chromium), contra o APP_URL do .env.
#   docker compose run --rm --build tests   → roda os testes
#
# O app NÃO sobe aqui: ele roda à parte (na sua máquina, num compose do repo dele
# ou no staging) e os testes o acessam pelo APP_URL.
name: curupira

services:
  tests:
    build: .
    env_file:
      - path: .env
        required: false
    extra_hosts:
      # host.docker.internal = a sua máquina (para testar um app rodando localmente)
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/tests              # o projeto inteiro: editar testes/config não exige rebuild
      - /tests/node_modules   # mas as dependências vêm da imagem (Linux + Node 24)
