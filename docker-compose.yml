# Runs the tests in a Playwright container (Node 24 + Chromium), against the APP_URL in .env.
#   docker compose run --rm --build tests   → runs the tests
#
# The app does NOT start here: it runs separately (on your machine, in its own repo's
# compose, or on staging) and the tests reach it through APP_URL.
name: curupira

services:
  tests:
    build: .
    env_file:
      - path: .env
        required: false
    extra_hosts:
      # host.docker.internal = your machine (to test an app running locally)
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/tests              # the whole project: editing tests/config needs no rebuild
      - /tests/node_modules   # but the dependencies come from the image (Linux + Node 24)
