# Runs the tests in a Playwright container (Node 24 + Chromium), against the service URLs in .env.
#   docker compose run --rm --build tests   → runs the tests
#
# The services do NOT start here: they run separately (on your machine, in their own
# repo's compose, or on staging) and the tests reach them through their URLs.
name: curupira

services:
  tests:
    build: .
    env_file:
      - path: .env
        required: false
    extra_hosts:
      # host.docker.internal = your machine (to test an app running locally)
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/tests              # the whole project: editing tests/config needs no rebuild
      - /tests/node_modules   # but the dependencies come from the image (Linux + Node 24)
