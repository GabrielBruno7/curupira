# Roda os testes e2e contra o STAGING, que já está publicado.
# Não bloqueia deploy: só mostra o resultado (e o GitHub avisa por e-mail quando falha).
#
# Configuração (Settings → Secrets and variables → Actions → Variables):
#   APP_URL = https://staging.<app>...   (precisa ser HTTPS)
name: e2e
run-name: e2e ${{ github.event.client_payload.app || github.event_name }} ${{ github.event.client_payload.version }}

on:
  # 1. Depois do deploy: o pipeline da aplicação dispara este evento
  #    (veja exemplos/disparar-e2e.yml, que vai no repo da aplicação).
  repository_dispatch:
    types: [deploy-staging]

  # 2. Todo dia às 6h (Brasília), para pegar problemas que não vieram de deploy.
  #    PAUSADO até existirem o primeiro teste e a variável APP_URL: para ligar, descomente.
  # schedule:
  #   - cron: '0 9 * * *'

  # 3. Na mão: botão "Run workflow" na aba Actions.
  workflow_dispatch:

# Uma execução por vez: dois deploys seguidos não rodam testes em paralelo no mesmo staging.
concurrency:
  group: e2e-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A mesma imagem do Dockerfile: Node 24 e navegadores já instalados.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4

      - run: npm ci

      - name: Testes
        run: npx playwright test
        env:
          APP_URL: ${{ vars.APP_URL }}

      # Relatório HTML, prints, vídeos e trace de cada teste que falhou: baixe na página da execução.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
