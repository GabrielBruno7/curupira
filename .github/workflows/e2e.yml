name: e2e
run-name: e2e ${{ github.event.client_payload.app || github.event_name }} ${{ github.event.client_payload.version }}

on:
  repository_dispatch:
    types: [deploy-staging]
  workflow_dispatch:

concurrency:
  group: e2e-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4

      - run: npm ci

      - name: Tests
        run: npx playwright test
        env:
          WALLET_API_URL: ${{ vars.WALLET_API_URL }}
          WALLET_DB_URL: ${{ secrets.WALLET_DB_URL }}
          WALLET_USERNAME: ${{ vars.WALLET_USERNAME }}
          WALLET_PASSWORD: ${{ secrets.WALLET_PASSWORD }}
          WALLET_DEVICE_ID: ${{ vars.WALLET_DEVICE_ID }}

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
