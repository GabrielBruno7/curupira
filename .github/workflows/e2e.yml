name: e2e
run-name: e2e ${{ github.event.client_payload.app || github.event_name }} ${{ github.event.client_payload.version }}

on:
  repository_dispatch:
    types: [deploy-staging]
  workflow_dispatch:

concurrency:
  group: e2e-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - name: Tests
        run: npx playwright test
        env:
          WALLET_API_URL: ${{ vars.WALLET_API_URL }}
          WALLET_DB_URL: ${{ secrets.WALLET_DB_URL }}
          WALLET_USERNAME: ${{ vars.WALLET_USERNAME }}
          WALLET_PASSWORD: ${{ secrets.WALLET_PASSWORD }}
          WALLET_DEVICE_ID: ${{ vars.WALLET_DEVICE_ID }}

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report
          retention-days: 7
          path: |
            playwright-report/
            test-results/
