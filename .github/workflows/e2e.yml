# Runs the e2e tests against STAGING, which is already deployed.
# Does not block deploys: it only shows the result (and GitHub emails when it fails).
#
# Setup (Settings → Secrets and variables → Actions → Variables):
#   <SERVICE>_URL, one per service, e.g. WALLET_API_URL = https://<wallet staging>   (must be HTTPS)
#   WALLET_USERNAME, WALLET_DEVICE_ID   (variables) and WALLET_PASSWORD (secret): a staging test user
name: e2e
run-name: e2e ${{ github.event.client_payload.app || github.event_name }} ${{ github.event.client_payload.version }}

on:
  # 1. After a deploy: the application pipeline triggers this event
  #    (see examples/trigger-e2e.yml, which goes in the application repo).
  repository_dispatch:
    types: [deploy-staging]

  # 2. Every day at 6am (Brasília), to catch problems that did not come from a deploy.
  #    PAUSED until the URL variables and the staging test user exist: uncomment to enable.
  # schedule:
  #   - cron: '0 9 * * *'

  # 3. By hand: the "Run workflow" button in the Actions tab.
  workflow_dispatch:

# One run at a time: two deploys in a row do not run tests in parallel on the same staging.
concurrency:
  group: e2e-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same image as the Dockerfile: Node 24 and browsers preinstalled.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4

      - run: npm ci

      - name: Tests
        run: npx playwright test
        env:
          WALLET_API_URL: ${{ vars.WALLET_API_URL }}
          WALLET_USERNAME: ${{ vars.WALLET_USERNAME }}
          WALLET_PASSWORD: ${{ secrets.WALLET_PASSWORD }}
          WALLET_DEVICE_ID: ${{ vars.WALLET_DEVICE_ID }}

      # HTML report, screenshots, videos and trace of each failed test: download them from the run page.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
